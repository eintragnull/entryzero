  // ---------- Fluss-Hilfen ----------
  function fluss(s, von, nach, art) {
    let f = s.fluesse.find((x) => x.von === von && x.nach === nach && x.art === art && !x.gerissen);
    if (!f) { f = { id: "f" + (s.fluesse.length + 1), von, nach, art, seit: s.meta.jahr, erwartetBis: null, samen: 0, gerissen: false }; s.fluesse.push(f); }

  function zuSchwaechstem(s, menge) {
    const ids = s.verbund.knoten;
    let ziel = ids[0];
    ids.forEach((id) => { if (deckungsgrad(s.knoten[id].korb) < deckungsgrad(s.knoten[ziel].korb)) ziel = id; });
    hebeTeilhabe(s.knoten[ziel].korb, menge * gabeFaktor(s, ziel));

  }
  function hebeTeilhabe(k, menge) {
    let rest = menge;
    while (rest > 1e-9) {
      let p = POS2[0]; POS2.forEach((q) => { if (k[q] < k[p]) p = q; });
      if (k[p] >= 1) break;
      const d = Math.min(rest, 1 - k[p], 0.1); k[p] = r3(k[p] + d); rest -= d;
    }
  }
  function aufnahme(s) { return 0.4 + 0.6 * s.region.vorAufbau.wasser; }
  function abhaengig(s) { return s.unerwartetSaisons.steighof >= 2; }
  function gabeFaktor(s, ziel) { return ziel === "steighof" && abhaengig(s) ? 0.25 : 1; }
  function hebeRegion(s, menge) {
    const k = s.region.korb; let rest = menge * aufnahme(s);
    const all = POS1.concat(POS2);
    while (rest > 1e-9) {
      let p = POS1[0]; POS1.forEach((q) => { if (k[q] < k[p]) p = q; });
      if (k[p] >= 1) { p = all[0]; all.forEach((q) => { if (k[q] < k[p]) p = q; }); if (k[p] >= 1) break; }
      const d = Math.min(rest, 1 - k[p], 0.05); k[p] = r3(k[p] + d); rest -= d;
    }
  }

  const REGELTYPEN = {

  function geltendeRegeln(s) { return s.verbund.archiv.filter((a) => !a.offen && a.gueltigAb <= s.meta.saison); }

  // Last buchen: bei Birk auf die Arbeitsfelder, sonst auf die Zeitlast des Knotens
  function last(s, id, h, verteilung) {

    const v = verteilung || { pflege: 1 / 3, werkstatt: 1 / 3, boden: 1 / 3 };
    FELDER.forEach((f) => { if (v[f]) k.felder[f].last = r3(k.felder[f].last + h * v[f]); });

  function kontingent(k) { if (!k.felder) return 3; const frei = FELDER.reduce((a, f) => a + Math.max(0, k.felder[f].kapazitaet - k.felder[f].last), 0); return Math.max(1, Math.min(4, Math.floor(frei / 20))); }
  function anerkennen(k, h) { k.anerkennung = r3((k.anerkennung || 0) + h); while (k.anerkennung >= 1) { k.spielraum += 1; k.anerkennung = r3(k.anerkennung - 1); } }
  function erschoepfteFelder(k) { return k.felder ? FELDER.filter((f) => k.felder[f].last > k.felder[f].kapazitaet) : []; }

  // Knotenrat (R-33): Haltung jeder Stimme zu einer Wirkung auf die Felder, aus der Lage ihres Feldes.

  function knotenrat(s, wirkung) {
    const k = s.knoten.birk, w = wirkung || {}, out = {};
    FELDER.forEach((f) => {
      const F = k.felder[f], nach = F.last + (w[f] || 0);
      let h = nach > F.kapazitaet ? "einwand" : (w[f] || 0) > 0 || nach > F.kapazitaet - 10 ? "bedenken" : "zustimmung";
      if (f === "boden" && (w.nh || 0) < 0) h = s.naturhaushalt.zustand + w.nh < s.naturhaushalt.kipp + 10 ? "einwand" : (h === "zustimmung" ? "bedenken" : h);
      out[F.stimme] = { feld: f, haltung: h };

  }
  // Bedingung einer Stimme: Last aus ihrem Feld in das Feld mit dem meisten Spielraum verlagern (oder, bei Rahel, die Entnahme halbieren)
  function bedingungVon(s, stimme, wirkung) {
    const k = s.knoten.birk, w = Object.assign({}, wirkung);
    const f = FELDER.find((x) => k.felder[x].stimme === stimme);
    if (f === "boden" && (w.nh || 0) < 0) { w.nh = w.nh / 2; return { text: "Nur so lange, bis Bach und Moor sich erholen; die Entnahme wird halbiert.", wirkung: w, halbiert: true }; }
    const frei = FELDER.filter((x) => x !== f).sort((a, b) => (k.felder[b].kapazitaet - k.felder[b].last - (w[b] || 0)) - (k.felder[a].kapazitaet - k.felder[a].last - (w[a] || 0)))[0];
    const zuviel = Math.max(0, k.felder[f].last + (w[f] || 0) - k.felder[f].kapazitaet);

    w[f] = (w[f] || 0) - verlagert; w[frei] = (w[frei] || 0) + verlagert;
    const b = { wirkung: w, von: f, nach: frei, stunden: Math.round(verlagert) };

  }

  function materialFrei(s) { return s.material.anteil - s.material.verbraucht; }

  function auflage(s, typ) { const a = s.verbund.archiv.find((x) => x.auflage && x.auflage.typ === typ && !x.offen && x.gueltigAb <= s.meta.saison); return a ? a.auflage : null; }
  // Erholungskraft in Worten, nie als Zahl (keine zweite Grösse zum Steigern)
  function erholungskraft(s) {
    const H = s.naturhaushalt;

  // ---------- Zustimmungsgrad (R-28): Haltung jedes Knotens zu einem Vorschlag ----------
  // Rein und deterministisch: aus Regeltyp und Lage, nicht aus einem Vertrauenswert (I-6).
  function zustimmung(s, r, aufl) {
    const dSt = deckungsgrad(s.knoten.steighof.korb), mued = (id) => s.knoten[id].zeitlast > s.knoten[id].zeitlastBasis + 20;
    const h = { weidmoos: "zustimmung", erlenbach: "zustimmung", birk: "zustimmung", steighof: "zustimmung" };
    if (r.typ === "speicher_vorrang" && r.ziel === "region") { h.erlenbach = dSt < 0.85 ? "einwand" : "bedenken"; h.steighof = dSt < 0.85 ? "einwand" : "bedenken"; h.weidmoos = dSt < 0.85 ? "bedenken" : "zustimmung"; }
    if (r.typ === "vorAufbau_quote") { h.erlenbach = mued("erlenbach") || mued("weidmoos") ? "einwand" : "bedenken"; h.weidmoos = mued("weidmoos") ? "einwand" : "bedenken"; }
    if (r.typ === "erwartung_verlaengern") { h.weidmoos = s.knoten.steighof.spielraumBasis < 1.5 ? "einwand" : "bedenken"; h.erlenbach = "bedenken"; }
    if (r.typ === "material_kreislauf") { h.erlenbach = mued("erlenbach") ? "einwand" : "bedenken"; h.steighof = "bedenken"; }
    if (r.typ === "material_grenze") { h.steighof = s.region.vorAufbau.wasser < 0.6 ? "einwand" : "bedenken"; }
    if (r.typ === "material_vorgriff") { h.weidmoos = "einwand"; }
    if (aufl) Object.keys(h).forEach((k) => { if (h[k] === "einwand") h[k] = "zustimmung"; });
    return h;
  }

  const EREIGNISSE = {

        (s.fonds.mittel >= 10

          : { id: "C", titel: "Die Schmiede von Tal-Süd ausrüsten, mit dem Rest des Übergangsfonds und eigenem Werkzeug", wirkung: { region: 0.02, hybrid: -0.04, ausbildung: 0.1, entwuerfe: 0.08, werkstatt: 25, fonds: -s.fonds.mittel, spaeter: [{ in: 1, wirkung: { region: 0.08 } }] } })],

  function mitRegisterSpannung(s) {
    const L = s.lage || { spannungen: [] }, sp = (L.spannungen || []).filter((x) => x.art !== "registerspannung");
    if (s.ereignis) s.ereignis.wege.forEach((w) => w.spannungen.forEach((r) => sp.push({ art: "registerspannung", feld: "Archiv", wo: "verbund", staerke: w.gesperrt ? 0.45 : 0.3,
      text: `Der Weg «${w.titel}» steht in Spannung zu eurer Regel ${r.nr}: «${r.text}»${w.gesperrt ? " Sie bindet: Der Weg ist gesperrt, bis ein Einwand mit neuem Faktum sie öffnet." : ""}` })));
    if (s.ereignis && s.ereignis.bindungRuht) sp.push({ art: "registerspannung", feld: "Archiv", wo: "verbund", staerke: 0.5, text: "Eure Regeln würden alle Wege dieses Ereignisses sperren; die Bindung ruht für dieses Ereignis." });
    let haupt = null; sp.forEach((x) => { if (!haupt || x.staerke > haupt.staerke) haupt = x; });
    s.lage = { spannungen: sp, haupt, weitere: sp.filter((x) => x !== haupt).map((x) => x.feld) };
  }
  // Tischschwelle (R-52): unter ihr läuft die Routine, der Tisch bleibt zu
  const TISCHSCHWELLE = { bach: 0.25, kuehle: 0.15, erfassung: 0.6, aufnahme: 0.35 };
  function waehleEreignis(s, ohneSchwelle) {
    let best = null;
    Object.keys(EREIGNISSE).forEach((id) => {
      const E = EREIGNISSE[id];
      if (E.jz !== s.meta.jz) return;
      const st = E.ausloeser(s);
      if (st > 0 && (ohneSchwelle || st >= (TISCHSCHWELLE[id] || 0)) && (!best || st > best.st)) best = { id, st };
    });
    if (!best) return null;
    const E = EREIGNISSE[best.id], wege = E.wege(s);
    const ws = wege.map((w) => { const p = pruefeWeg(s, w);
      return { id: w.id, titel: w.titel, wirkung: w.wirkung, tags: w.tags || [], regel: w.regel || null, regeltext: w.regel ? REGELTYPEN[w.regel.typ].text(w.regel) : null,
        haltungen: knotenrat(s, w.wirkung), spannungen: p.spannungen, sperren: p.sperren, gesperrt: p.sperren.length > 0 }; });
    let ruht = false;
    if (ws.every((w) => w.gesperrt)) { ruht = true; ws.forEach((w) => { w.gesperrt = false; }); }   // Sperr-Schutz (R-40, I-11)
    return { id: best.id, titel: E.titel, lage: E.lage(s), staerke: r3(best.st), jahr: s.meta.jahr, jz: s.meta.jz, wege: ws, bindungRuht: ruht, stillstand: E.stillstand(s) };
  }

  // Wirkung anwenden: nur Grössen des Kerns; nie Schicht 1 der Mitglieder (I-1)
  function wirke(s, w, quelle) {
    const birk = s.knoten.birk;
    FELDER.forEach((f) => { if (w[f]) last(s, "birk", w[f], { [f]: 1 }); });
    if (w.ried) s.ried.teilhabe = r3(clamp(s.ried.teilhabe + w.ried, 0, 1));
    if (w.nh) { s.naturhaushalt.zustand = r3(clamp(s.naturhaushalt.zustand + w.nh, 0, 100)); if (s.naturhaushalt.zustand < s.naturhaushalt.kipp) s.naturhaushalt.gekippt = true; }
    if (w.bau) s.verbund.budget.bau = r3(s.verbund.budget.bau + w.bau);
    if (w.material) verbrauche(s, w.material);
    if (w.reserve) birk.reserveTage = Math.round(clamp(birk.reserveTage + w.reserve, 0, 200));
    if (w.spielraumAlle) s.verbund.knoten.forEach((id) => { s.knoten[id].spielraum = Math.max(0, s.knoten[id].spielraum + w.spielraumAlle); });
    if (w.spielraumBirk) birk.spielraum = Math.max(0, birk.spielraum + w.spielraumBirk);
    if (w.birkKorb) Object.keys(w.birkKorb).forEach((p) => { if (POS2.indexOf(p) >= 0) birk.korb[p] = r3(clamp(birk.korb[p] + w.birkKorb[p], 0, 1)); });
    if (w.region) hebeRegion(s, w.region);
    if (w.regionKorb) Object.keys(w.regionKorb).forEach((p) => { s.region.korb[p] = r3(clamp(s.region.korb[p] + w.regionKorb[p], 0, 1)); });
    if (w.hybrid) s.region.hybridAnteil = r3(clamp(s.region.hybridAnteil + w.hybrid, 0, 1));
    if (w.ausbildung) s.region.vorAufbau.ausbildung = r3(clamp(s.region.vorAufbau.ausbildung + w.ausbildung, 0, 1));
    if (w.entwuerfe) s.region.synchronisation.entwuerfe = r3(clamp(s.region.synchronisation.entwuerfe + w.entwuerfe, 0, 1));
    if (w.gabeRegion) fluss(s, "birk", "region", "gabe").samen += w.gabeRegion;
    if (w.fonds) s.fonds.mittel = r3(Math.max(0, s.fonds.mittel + w.fonds));
    if (w.plan && s.gemeingut.plaene.indexOf(w.plan) < 0) s.gemeingut.plaene.push(w.plan);
    if (w.erfassung) { s.erfassung = w.erfassung; if (w.erfassung === "lueckenlos") s.sorgeGezaehlt = true; }
    (w.spaeter || []).forEach((x) => s.spaeter.push({ abSaison: s.meta.saison + x.in, wirkung: x.wirkung, quelle }));
  }
  function addiere(a, b) {
    const w = clone(a);
    Object.keys(b).forEach((k) => { if (typeof b[k] === "number") w[k] = r3((w[k] || 0) + b[k]); else if (b[k] !== undefined) w[k] = b[k]; });
    return w;
  }

  const EREIGNISTYPEN = ["START", "STUNDE", "TEILEN", "ANGEBOT", "BESCHLUSS", "EINWAND", "EREIGNIS_BESCHLUSS", "JAHRESZEIT_ENDE", "WEITERGABE"];
  const ZUEGE = ["STUNDE", "TEILEN", "ANGEBOT", "BESCHLUSS", "EINWAND", "EREIGNIS_BESCHLUSS"];
  const SATZ_MAX = 200;

  function tuersteher(s, e) {
    if (!e || EREIGNISTYPEN.indexOf(e.typ) < 0) return "Unbekannter Eintragstyp. Es gibt keinen Eintrag zur Übertragung von Stunden, und ein KI-Sprachmodell trägt nichts ein.";
    if (e.typ === "START") return s ? "Die Welt hat schon begonnen." : null;
    if (!s) return "Die Welt hat noch nicht begonnen.";
    if (e.quelle && POS1.indexOf(e.quelle) >= 0) return "I-1: Die Grundsicherung (Schicht 1) kann durch keinen Zug gesenkt werden.";
    if (ZUEGE.concat(["WEITERGABE"]).indexOf(e.typ) >= 0) {
      if (!e.urheber || String(e.urheber).indexOf("mensch:") !== 0) return "I-8: Nur Menschen tragen ein; ein KI-Sprachmodell trägt nichts ein.";
      const k = s.knoten[String(e.urheber).slice(7)];
      if (!k) return "Unbekannter Knoten.";
    }
    if (ZUEGE.indexOf(e.typ) >= 0 && s.amtszeit && s.amtszeit.beendet) return "Dein Jahr ist zu Ende. Was gibst du weiter?";
    if (e.typ === "WEITERGABE") {
      if (!s.amtszeit || !s.amtszeit.beendet) return "Weitergegeben wird am Ende des Jahres.";
      if (e.satz !== undefined && e.satz !== null && typeof e.satz !== "string") return "Weitergegeben wird ein Satz.";
      const t = String(e.satz || "").trim();
      if (t.length > SATZ_MAX) return `Ein Satz, nicht mehr: höchstens ${SATZ_MAX} Zeichen.`;
      if (/[\r\n]/.test(t)) return "Ein Satz, ohne Zeilenumbruch.";
    }
    if (e.typ === "STUNDE") {
      if (s.meta.jz !== 0) return "Stunden werden in Stufe 1 im Frühling eingesetzt.";
      const k = s.knoten[e.urheber.slice(7)];
      if (k.stunden < 1) return "I-9: Keine Stunden mehr in dieser Jahreszeit.";
      if (["spielraum", "vorAufbau", "steighof", "blaupause"].indexOf(e.ziel) < 0) return "Ziel unbekannt.";
      if (e.ziel === "blaupause" && s.gemeingut.pumpe.stufe >= 3) return "Der Bauplan der Pumpe ist ausgereift; eine weitere Stunde verbessert ihn nicht mehr.";
      const ausnahme = auflage(s, "ausnahme_vorAufbau") ? auflage(s, "ausnahme_vorAufbau").menge : 0;
      if (e.ziel === "vorAufbau" && regelGilt(s, "material_grenze") && materialFrei(s) + ausnahme < materialFaktor(s) * pumpeFaktor(s)) return "Eure Regel «Material-Grenze» bindet: Der Materialanteil ist ausgeschöpft. Ein Einwand mit neuem Faktum kann sie öffnen.";
    }
    if (e.typ === "TEILEN") {
      if (s.meta.jz !== 1) return "Spielraum wird in Stufe 1 im Sommer geteilt.";
      const k = s.knoten[e.urheber.slice(7)];
      if (e.ziel !== "behalten" && k.spielraum < 1) return "Kein Spielraum mehr zu teilen.";
      if (e.ziel !== "behalten" && e.ziel !== "speicher" && s.verbund.knoten.indexOf(e.ziel) < 0) return "Ziel unbekannt.";
      if (e.ziel === e.urheber.slice(7)) return "Man teilt nicht mit sich selbst.";
    }
    if (e.typ === "ANGEBOT") {
      if (["vertrag", "zeichnung"].indexOf(e.angebot) < 0) return "Angebot unbekannt.";
      if (e.angebot === "vertrag" && s.meta.jz !== 0) return "Der Vertrag kommt in Stufe 1 im Frühling.";
      if (e.angebot === "zeichnung" && s.meta.jz !== 3) return "Die Zeichnung bietet Tal-Süd im Winter an.";
      if (e.angebot === "zeichnung" && s.region.reihung.gezeichnet) return "Tal-Süd hat bereits gezeichnet.";
    }
    if (e.typ === "BESCHLUSS") {
      if (!e.regel || !REGELTYPEN[e.regel.typ]) return "Die Automatik kennt diesen Regeltyp nicht; sie erfindet keine Regeln.";
      if (!e.gegengrund) return "Ein Beschluss trägt seinen Gegengrund.";
      if (e.angepasst && !e.bedingung) return "Ein angepasster Beschluss nennt die Bedingung, die er aufnimmt.";
      if (e.angepasst && e.mehrheit) return "Angepasst und überstimmt zugleich geht nicht.";

    }

      const E = s.ereignis;

      if (["gemeinsam", "durchsetzen", "werben"].indexOf(e.ausgang) < 0) return "Unbekannter Ausgang.";

        const W = E.wege.find((x) => x.id === e.weg);
        if (!W) return "Unbekannter Weg.";
        if (W.gesperrt) return `Eure Regel ${W.sperren[0].nr} bindet: «${W.sperren[0].text}» Dieser Weg ist gesperrt. Ein Einwand mit neuem Faktum kann die Regel öffnen.`;
        const einwaende = Object.keys(W.haltungen).filter((k) => W.haltungen[k].haltung === "einwand");
        const ohne = einwaende.filter((k) => (e.bedingungen || []).indexOf(k) < 0);
        if (e.ausgang === "gemeinsam" && ohne.length) return "Gemeinsam geht nur, wenn jeder Einwand mit seiner Bedingung aufgenommen ist: " + ohne.join(", ") + ".";
      }
    }
    return null;
  }

  // ---------- Anwendung eines Eintrags ----------
  function anwenden(s, e) {
    if (e.typ === "START") { const n = startzustand(e.seed); n.ereignis = waehleEreignis(n); mitRegisterSpannung(n); n.amtszeit = neueAmtszeit(n, 1); n.protokoll.push(e); return n; }
    s = clone(s);
    const ich = e.urheber ? s.knoten[e.urheber.slice(7)] : null;

    if (e.typ === "STUNDE") {
      ich.stunden -= 1;
      if (e.ziel === "spielraum") { ich.spielraum += 1; }
      else if (e.ziel === "blaupause") {
        s.gemeingut.pumpe.stufe += 1;
        s.gemeingut.pumpe.verbesserungen.push({ jahr: s.meta.jahr, von: ich.id });
        last(s, ich.id, 15, { werkstatt: 1 }); ich.blaupausen += 1;
      }
      else if (e.ziel === "steighof") {
        const st = s.knoten.steighof;
        hebeTeilhabe(st.korb, 0.05);
        st.spielraumBasis = r3(Math.min(3, st.spielraumBasis + 0.1));
        if (s.unerwartetSaisons.steighof > 0) s.unerwartetSaisons.steighof -= 1;
        last(s, ich.id, 15, { werkstatt: 0.5, pflege: 0.5 }); anerkennen(ich, 0.5);
        fluss(s, ich.id, "steighof", "arbeit").samen += 1;
      }
      else {
        s.region.vorAufbau.wasser = r3(clamp(s.region.vorAufbau.wasser + 0.08, 0, 1));
        s.region.korb.wasser = r3(clamp(s.region.korb.wasser + 0.04, 0, 1));

  // ---------- Amtszeit, Bild und Weitergabe (R-47 bis R-51) ----------

  // ---------- Sätze für die Tür, Deutsch und Englisch (R-53, Blick, Wandel, Bach, Bedingung) ----------

  const FELD_SATZ = {

  function preisTeile(w) {

  // ---------- Der Blick: ein Satz zu jedem Kreis, ohne Zahl (Tür) ----------
  function blick(s, kreis, sp) {

  // ---------- Rückschau: was eine frühere Sprecherin auf dem Rückweg sieht ----------

    if (s.ried.teilhabe < SCHWELLEN.teilhabe) sp.push({ art: "ried", feld: "Versorgung", wo: "ried", staerke: r3((SCHWELLEN.teilhabe - s.ried.teilhabe) / SCHWELLEN.teilhabe), text: "Ried im Nachbarverbund liegt unter der Teilhabe-Schwelle." });
    if (V.beratung.erzwungen > 0) sp.push({ art: "beratung", feld: "Gerechtigkeit", wo: "verbund", staerke: r3(0.15 * V.beratung.erzwungen), text: "Es wurde überstimmt statt getragen." });

  // ---------- Die Bilanz: alle Felder, drei Ebenen, keine Gesamtzahl, keine Reihung ----------

        resilienz: { reserveTage: Math.round(k.reserveTage + V.speicher * 2) },

      };
    });
    const dgs = ids.map((id) => deckungsgrad(s.knoten[id].korb));
    const zl = ids.map((id) => s.knoten[id].zeitlast);
    const fl = s.fluesse;
    return {
      knoten,
      verbund: {
        versorgung: { amSchwaechsten: r3(Math.min(...dgs)) },
        biosphaere: { naturhaushalt: Object.assign(clone(s.naturhaushalt), { erholungskraft: erholungskraft(s) }), material: { anteil: s.material.anteil, verbraucht: s.material.verbraucht, vorgriff: s.material.vorgriff }, budgetImHintergrund: { nutzung: V.budget.nutzung, deckel: V.budget.deckel, gerissen: V.budget.gerissen } },
        zeitwohlstand: { spreizungDerLast: r3(Math.max(...zl) / Math.min(...zl)) },
        resilienz: { speicher: V.speicher },
        gerechtigkeit: { spreizung: r3(Math.max(...dgs) / Math.min(...dgs)), beratung: clone(V.beratung) },

          verrechnet: fl.filter((f) => f.art === "vertrag").length,
          gerissen: fl.filter((f) => f.gerissen).length,

  // ---------- Invarianten als Prüfungen (Bauweg §3.4, §7.6) ----------
  function pruefeInvarianten(s, vorher) {
    const res = [];

    ok("I-3", !vorher || ((!vorher.verbund.budget.gerissen || s.verbund.budget.gerissen) && (!vorher.naturhaushalt.gekippt || s.naturhaushalt.gekippt) && s.material.vorgriff >= vorher.material.vorgriff), "Riss der Grenze, Kippen des Naturhaushalts und Vorgriff auf Material bleiben bestehen");
    const verboten = /gesamt|score|punkte|index|rang|ranking|vertrau|trust/i;
    const schluessel = []; (function scan(o, pfad) { if (o && typeof o === "object") Object.keys(o).forEach((k) => { if (verboten.test(k)) schluessel.push(pfad + k); scan(o[k], pfad + k + "."); }); })({ b: B, z: Object.assign({}, s, { protokoll: [], verfassung: [] }) }, "");
    ok("I-4/5/6", schluessel.length === 0, "Keine Gesamtzahl, keine Reihung, kein Vertrauenswert" + (schluessel.length ? ": " + schluessel.join(", ") : ""));
    ok("I-6", Object.keys(s.siebtesFeld).join() === "inhalt" && s.siebtesFeld.inhalt.every((t) => typeof t === "string"), "Siebtes Feld nur als Text");
    ok("I-8", s.verbund.archiv.every((a) => String(a.urheber).indexOf("mensch:") === 0) && s.register.every((r) => String(r.urheber).indexOf("mensch:") === 0 || r.urheber === "verfassung"), "Archiv und Register nur aus menschlichen Beschlüssen (oder dem Stillstand der Verfassung)");
    ok("I-8", s.protokoll.filter((e) => e.typ === "WEITERGABE").every((e) => String(e.urheber).indexOf("mensch:") === 0), "Weitergegeben wird nur von Menschen");
    ok("I-9", ids.every((id) => s.knoten[id].stunden <= 4 && s.knoten[id].stunden >= 0), "Stunden nicht ansparbar");
    ok("I-11", !s.ereignis || s.ereignis.wege.some((w) => !w.gesperrt), "Geltende Regeln sperren nie alle Wege eines Ereignisses");
    const alleKoerbe = ids.map((id) => s.knoten[id].korb).concat([s.region.korb]);
    ok("I-10", alleKoerbe.every((k) => Object.values(k).every((v) => v <= 1)), "Keine Korbposition über dem Genug");
    return res;
  }

  // ---------- Öffentliche Schnittstelle ----------
  function eintragen(s, e) {
    const grund = tuersteher(s, e);
    if (grund) return { ok: false, grund, zustand: s };
    const n = anwenden(s, e);
    const inv = pruefeInvarianten(n, s).filter((x) => !x.ok);
    if (inv.length) return { ok: false, grund: "Invariante verletzt: " + inv.map((x) => x.id).join(", "), zustand: s };

  }
  function nachspielen(protokoll) {
    let s = null;
    for (const e of protokoll) { const r = eintragen(s, e); if (!r.ok) throw new Error("Nachspielen fehlgeschlagen: " + r.grund); s = r.zustand; }
    return s;
  }
  function neueWelt(seed) { return eintragen(null, { typ: "START", seed: seed >>> 0 }).zustand; }

  return {
    VERSION, VERMERK, JAHRESZEITEN, POS1, POS2, POS_NAME, SIEBTES_FELD, NETZ_2060, REGELREGISTER, REGELTYPEN, SCHWELLEN,
    neueWelt, eintragen, nachspielen, bilanz, pruefeInvarianten, pruefsumme, deckungsgrad, erholungskraft, zustimmung, pumpeFaktor, knotenrat, bedingungVon, FELDER, EREIGNISSE,
    kontingent, spielstand, ladeSpielstand, rueckschau, blick, wandel, preisVon, preisInWorten, bedingungText, bachSatz, FELD_SATZ, SATZ_MAX, TISCHSCHWELLE, _waehleEreignis: waehleEreignis   // nur für Prüfungen und die Werkstatt (zweites Argument: ohne Tischschwelle)
  };

// ---------- Die Fäden: Linien zwischen den Kreisen, ohne Zahl ----------
function faeden() {

  document.querySelectorAll("[data-kreis]").forEach((k) => { const r = k.getBoundingClientRect(); mitte[k.dataset.kreis] = [r.left - feld.left + r.width / 2, r.top - feld.top + r.height / 2]; rad[k.dataset.kreis] = r.width / 2; });
  const ziel = { steighof: "steighof", region: "talsued", speicher: "gemein" }, linien = {};
  S.fluesse.forEach((f) => {
    let a = null, art = "";
    if (f.von === "birk" && ziel[f.nach]) { a = ziel[f.nach]; art = f.art === "vertrag" ? "vertrag" : ""; }
    else if (f.nach === "birk" && f.von === "region") { a = "talsued"; art = "vertrag"; }
    else if (f.von === "region" && f.nach === "fonds") { a = "talsued"; art = "vertrag"; }
    if (!a) return;
    if (f.gerissen) art = "gerissen";
    else if (a === "steighof" && S.unerwartetSaisons.steighof >= 2) art = "unruhig";
    linien[a + art] = { a, art };

  let o = "";

    const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l, versatz = art === "vertrag" ? 7 : 0;
    const x1 = p[0] + ux * (rad.birk - 2) - uy * versatz, y1 = p[1] + uy * (rad.birk - 2) + ux * versatz, x2 = q[0] - ux * (rad[a] - 2) - uy * versatz, y2 = q[1] - uy * (rad[a] - 2) + ux * versatz;
    o += `<line class="${art}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  });
  svg.innerHTML = o;
}
